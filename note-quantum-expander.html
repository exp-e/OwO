<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quantum Expander 笔记 · 锁定</title>
<style>
body{margin:0;background:#f3efff;color:#282038;font:16px/1.65 system-ui,sans-serif}
main{box-sizing:border-box;width:min(480px,calc(100% - 32px));margin:8vh auto;padding:26px;border:1px solid #dcccf3;border-radius:16px;background:#fff}
img{width:100%;max-height:240px;object-fit:cover;border-radius:10px}
a{color:#5921c2} h1{font-size:24px} label{display:block;margin-top:10px}
input,select,button{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;font:inherit;border:1px solid #a596bf;border-radius:8px}
button{background:#5921c2;color:#fff;cursor:pointer} #status{min-height:1.65em}
</style>
<main>
<a href="index.html#notes">← 返回笔记</a>
<h1>Quantum Expander 笔记</h1>
<img src="assets/aixyx.jpg" alt="Quantum Expander 笔记封面">
<p>量子扩展器定义与谱隙、16 个酉矩阵的深度-1 构造、SU(2^n) 上的 k-design 及其在多体物理中的关联与纠缠熵应用。</p>
<form id="unlock">
<label for="secret">文章专用密码</label>
<input id="secret" type="password" autocomplete="current-password" required>
<button>解锁文章</button>
</form>
<button id="owner-login" type="button">使用博主账号登录</button>
<p id="status" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/site-auth.js"></script>
<script src="assets/locked-expander.js"></script>
<script>
const form = document.getElementById('unlock');
const secret = document.getElementById('secret');
const statusEl = document.getElementById('status');
const button = form.querySelector('button');
function showArticle(html) {
  document.open();
  document.write(html);
  document.close();
}
lockedExpander.read().then(html => {
  if (html) showArticle(html);
}).catch(() => {});
document.getElementById('owner-login').onclick = () => siteAuth.promptOwnerLogin(async () => {
  try {
    const html = await lockedExpander.read();
    if (!html) throw new Error();
    showArticle(html);
  } catch {
    statusEl.textContent = '博主已登录，但暂时无法读取本文。也可使用文章专用密码。';
  }
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  button.disabled = true;
  statusEl.textContent = '正在验证…';
  try {
    const html = await lockedExpander.read(secret.value.trim());
    showArticle(html);
  } catch {
    statusEl.textContent = '无法解锁，请检查口令或换一种验证方式。';
    secret.focus();
  } finally {
    button.disabled = false;
  }
});
</script>
</html>
