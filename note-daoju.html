.toc-list a:hover{color:var(--accent);background:var(--accent-soft);}
.toc-list a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:500;}
.toc-list li.sub a{padding-left:22px;font-size:12.5px;}

.article-body{flex:1;min-width:0;background:var(--card-solid);border-radius:var(--radius);border:1px solid var(--border-soft);padding:40px 48px 56px;box-shadow:0 8px 40px rgba(113,57,218,0.08);}

<script>
(function(){
  var tocLinks=document.querySelectorAll('.toc-list a');
  var sections=[];
  tocLinks.forEach(function(a){var id=a.getAttribute('href').slice(1);var el=document.getElementById(id);if(el)sections.push({id:id,el:el,link:a});});
  function onScroll(){var scrollY=window.scrollY+100;var current=sections[0];for(var i=0;i<sections.length;i++){if(sections[i].el.offsetTop<=scrollY)current=sections[i];}
  tocLinks.forEach(function(a){a.classList.remove('active');});if(current)current.link.classList.add('active');}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
