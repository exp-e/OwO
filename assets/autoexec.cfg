// CS2 settings snapshot 2026-10-27. Existing custom aliases are preserved below.

alias +pwaswitchknife slot3
alias -pwaswitchknife lastinv
alias "+pwa_fn" "pwa_fn_down"
alias "-pwa_fn" "pwa_fn_up"
alias "refundall" "sellback 0;sellback 1;sellback 2;sellback 3;sellback 4;sellback 5;sellback 6;sellback 8;sellback 9;sellback 10;sellback 11;sellback 12;sellback 13;sellback 14;sellback 15;sellback 16;sellback 17;sellback 18;sellback 26;sellback 26;sellback 27;sellback 28;sellback 29;sellback 30;sellback 32;sellback 33;sellback 34;sellback 35;play ui\panorama\itemtile_click_02.vsnd_c"

// ==============================
// Knife + Inspect
// ==============================

alias "pwa_inspect_once" "+lookatweapon; -lookatweapon"

alias "pwa_reset_wheelup" "bind MWHEELUP pwa_wheelup_knife"

alias "pwa_wheelup_knife" "slot3; pwa_inspect_once; bind MWHEELUP pwa_wheelup_inspect"

alias "pwa_wheelup_inspect" "slot3; pwa_inspect_once; pwa_reset_wheelup"

alias "pwa_wheeldown_primary" "slot1; pwa_reset_wheelup"

alias "pwa_q_pistol" "slot2; pwa_reset_wheelup"

// Your binds
bind "MWHEELUP" "pwa_wheelup_knife"
bind "MWHEELDOWN" "pwa_wheeldown_primary"
bind "Q" "pwa_q_pistol"
bind "Y" "+lookatweapon"

// Force initial state to knife
pwa_reset_wheelup

